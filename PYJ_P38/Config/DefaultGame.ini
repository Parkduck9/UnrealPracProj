[/Script/PYJ_P38.ServerRegistrySettings]
; Web registry the game talks to. Override per launch with -RegistryUrl=http://host:port
; The quotes are required: the config parser treats // as a comment and would truncate this to "http:".
ApiBaseUrl="http://127.0.0.1:8080"
; Shared secret required by the /api/servers/* endpoints. Change it before exposing the registry.
ServerApiKey=dev-server-key
RequestTimeoutSeconds=10.000000

; --- Dedicated server ---
bAutoRegisterOnDedicatedServer=True
; Empty ServerName falls back to the machine name.
ServerName=
Region=KR
MaxPlayers=32
HeartbeatIntervalSeconds=10.000000
; Empty PublicIpOverride lets the registry record the address the request came from.
PublicIpOverride=

; --- Client ---
; Turn this on to have a packaged client log in and connect without any UI.
bAutoLoginOnClientStart=False
AutoLoginUsername=
AutoLoginPassword=
bAutoJoinAfterLogin=True
